name: Windows FFI memory ownership

on:
  push:
    branches: ['palmoni5/fix-windows-notification-memory-*']
    paths:
      - 'flutter_local_notifications_windows/src/**'
      - 'flutter_local_notifications_windows/test/native/**'
      - '.github/workflows/windows_ffi_memory.yml'
  pull_request:
    paths:
      - 'flutter_local_notifications_windows/src/**'
      - 'flutter_local_notifications_windows/test/native/**'
      - '.github/workflows/windows_ffi_memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flutter_local_notifications_windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production deallocators with ASan and UBSan
        run: >-
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie
          src/ffi_memory.cpp test/native/ffi_memory_test.cpp -o ffi_memory_test
      - name: Exercise the actual C ABI deallocators
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./ffi_memory_test

  windows-ownership:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run production deallocators with MSVC ASan
        shell: pwsh
        working-directory: flutter_local_notifications_windows
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=1
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $command = "call `"$vcvars`" && cl /nologo /std:c++17 /EHsc /Zi /W4 /WX /fsanitize=address src\ffi_memory.cpp test\native\ffi_memory_test.cpp /Fe:ffi_memory_test.exe && ffi_memory_test.exe"
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
